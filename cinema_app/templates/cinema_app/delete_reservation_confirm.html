{% extends 'base.html' %}
{% block title %}Confirmer l'annulation{% endblock %}

{% block content %}

<div class="max-w-md mx-auto bg-cinema-dark border border-white/10 rounded-xl p-8 text-center">
    <i class="fa-solid fa-triangle-exclamation text-yellow-500 text-4xl mb-4"></i>
    <h2 class="text-xl font-bold text-white mb-2">Annuler cette réservation ?</h2>
    <p class="text-gray-400 mb-6">
        {{ reservation.film.title }} — {{ reservation.date|date:"d/m/Y" }} à {{ reservation.hour }}
    </p>

    <form method="post" class="flex gap-3">
        {% csrf_token %}
        <a href="{% url 'account' %}"
           class="flex-1 py-2.5 rounded-md bg-white/10 text-white font-semibold hover:bg-white/20 transition-colors">
            Retour
        </a>
        <button type="submit"
                class="flex-1 py-2.5 rounded-md bg-cinema-red text-white font-semibold hover:bg-red-700 transition-colors">
            Confirmer
        </button>
    </form>
</div>

{% endblock %}
