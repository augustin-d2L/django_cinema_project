{% extends 'base.html' %}
{% block title %}Connexion{% endblock %}

{% block content %}

<div class="max-w-md mx-auto bg-cinema-dark border border-white/10 rounded-xl p-8">
    <h2 class="text-2xl font-bold text-white mb-6 text-center">Connexion</h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}

        {% if form.errors %}
        <p class="text-red-400 text-sm">Nom d'utilisateur ou mot de passe incorrect.</p>
        {% endif %}

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">{{ form.username.label }}</label>
            {{ form.username }}
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">{{ form.password.label }}</label>
            {{ form.password }}
        </div>

        <button type="submit"
                class="w-full py-2.5 rounded-md bg-cinema-red text-white font-bold uppercase tracking-wide text-sm hover:bg-red-700 transition-colors">
            Se connecter
        </button>

        <p class="text-center text-gray-400 text-sm mt-4">
            Pas encore de compte ?
            <a href="{% url 'register' %}" class="text-cinema-red hover:underline">Créer un compte</a>
        </p>
    </form>
</div>

{% endblock %}
